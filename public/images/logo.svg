<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="innowizeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dot above the left arm of W (representing 'i' in 'iw') -->
  <circle cx="16" cy="14" r="5" fill="url(#innowizeBlueGrad)" filter="url(#glow)" />

  <!-- Fluid curved 'W' shape matching the brand mark -->
  <path d="M16 26 C16 38, 24 48, 32 48 C40 48, 47 38, 51 28 C55 38, 62 48, 70 48 C78 48, 86 38, 88 24" 
        stroke="url(#innowizeBlueGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- innowize text -->
  <text x="108" y="34" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Poppins', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">
    innowize
  </text>

  <!-- DIGITAL text -->
  <text x="110" y="49" fill="#3B82F6" font-family="system-ui, -apple-system, 'Poppins', sans-serif" font-size="11" font-weight="600" letter-spacing="0.32em">
    DIGITAL
  </text>
</svg>
